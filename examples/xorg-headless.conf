# EXAMPLE ONLY. Replace decimal BusID with the GPU you are authorized to use.
# Rootless Xorg and seat permissions vary by distribution.
Section "ServerFlags"
    Option "AutoAddDevices" "False"
EndSection

Section "Device"
    Identifier "DedicatedGPU"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "UseDisplayDevice" "None"
EndSection

Section "Screen"
    Identifier "DedicatedScreen"
    Device "DedicatedGPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
